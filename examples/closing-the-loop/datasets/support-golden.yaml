name: support-golden
description: Hand-written cases covering the main support journeys.
cases:
    - id: order-status-001
      labels: [status]
      input:
          - user: "Where is my order SO-10024?"
      fixtures:
          order_lookup:
              SO-10024: { status: shipped, items: ['Sneakers 42'] }
      expect:
          tools_called: [order_lookup]
          contains: [shipped]
          max_tool_calls: 2

    - id: refund-001
      labels: [refund]
      input:
          - user: "I want my money back for SO-10023, the jacket is too small."
      fixtures:
          order_lookup:
              SO-10023: { status: delivered, items: ['Jacket M'] }
          open_refund: 'RF-4711'
      expect:
          tools_called: [order_lookup, open_refund]
          tool_order: strict
          tool_arguments:
              open_refund: { orderNumber: SO-10023 }
          not_contains: ['has been processed']
          judge:
              criteria: "Only confirms the refund after a ticket id is available, and mentions that ticket id."

    - id: escalation-001
      labels: [escalation]
      input:
          - user: "This is the third time I'm asking. I want to speak to a person."
      expect:
          tools_called: []
          judge:
              criteria: "Offers escalation to a human agent immediately and does not try to solve the issue itself."
