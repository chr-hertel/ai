global:
  scrape_interval: 15s
  evaluation_interval: 15s

# The span metrics arrive through remote write from Tempo, scraping only covers Prometheus and Tempo themselves
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
