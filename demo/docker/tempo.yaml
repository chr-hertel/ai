# Single-binary Tempo for the demo, based on https://github.com/grafana/tempo/tree/v3.0.3/example/docker-compose/single-binary
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "tempo:4317"
        http:
          endpoint: "tempo:4318"

# Turns the spans into Prometheus metrics: calls, errors and latency
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: ["span-metrics", "service-graphs"]
      generate_native_histograms: both
      processor:
        span_metrics:
          # GenAI span attributes as labels, e.g. gen_ai_request_model="gpt-4.1"
          dimensions:
            - gen_ai.operation.name
            - gen_ai.provider.name
            - gen_ai.request.model
            - gen_ai.agent.name
            - gen_ai.tool.name

usage_report:
  reporting_enabled: false
