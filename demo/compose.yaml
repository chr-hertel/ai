services:
###> doctrine/doctrine-bundle ###
  database:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  # Jaeger as the OpenTelemetry tracing backend, UI on port 16686
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    command: ['--config', '/etc/jaeger/config.yaml']
    volumes:
      - ./docker/jaeger.yaml:/etc/jaeger/config.yaml:ro
      # On /tmp, so the volume inherits its permissions and Jaeger's non-root user can write to it
      - jaeger_data:/tmp

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  jaeger_data:
