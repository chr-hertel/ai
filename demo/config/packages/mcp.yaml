mcp:
    servers:
        demo:
            name: demo-app
            version: 0.0.1
            pagination_limit: 10
            instructions: |
                This demo MCP server provides time management capabilities for developers.

                Use this server when you need to work with timestamps, time zones, or time-based calculations.

            transports:
                stdio: true
                http: true
            http:
                path: /_mcp
            session:
                store: file

            tools: ['*']
            prompts: ['*']
            resources: ['*']
            resource_templates: ['*']
            apps: ['*']

    # Acting as an MCP client: "app:subway:clock" reaches this public, unauthenticated
    # server for live NYC transit data.
    clients:
        nyc:
            client_info:
                name: symfony-ai-demo
                version: 0.0.1
            servers:
                subway:
                    transport: http
                    url: 'https://subwayinfo.nyc/mcp'
